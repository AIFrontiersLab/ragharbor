apiVersion: apps/v1
kind: Deployment
metadata:
  name: answer-or-abstain-rag
  namespace: answer-or-abstain-rag
  labels: {app.kubernetes.io/name: answer-or-abstain-rag}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: answer-or-abstain-rag}
  template:
    metadata:
      labels: {app.kubernetes.io/name: answer-or-abstain-rag}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: app
          image: answer-or-abstain-rag:0.1.0
          ports: [{containerPort: 8080}]
          env:
            - {name: ANSWER_OR_ABSTAIN_RAG_CONFIG, value: /config/production.toml}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 15}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: data, mountPath: /app/var}
      volumes:
        - {name: config, configMap: {name: answer-or-abstain-rag-config}}
        - {name: data, emptyDir: {}}
