apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: answer-or-abstain-rag
  namespace: answer-or-abstain-rag
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: answer-or-abstain-rag}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
