apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: answer-or-abstain-rag-ingress
  namespace: answer-or-abstain-rag
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: answer-or-abstain-rag}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gateway}
      ports: [{port: 8080}]
